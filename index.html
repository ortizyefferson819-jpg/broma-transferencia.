<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    overflow: hidden;
}

.pantalla {
    width: 100%;
    min-height: 100vh;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.contenido {
    width: 100%;
    max-width: 450px;
}

.logo {
    font-size: 48px;
    font-weight: bold;
    color: #e5007d;
    margin-bottom: 25px;
}

.verde {
    color: #16a34a;
    font-weight: bold;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 6px solid #eee;
    border-top: 6px solid #e5007d;
    border-right: 6px solid #16a34a;
    border-radius: 50%;
    animation: girar 1s linear infinite;
    margin: auto;
}

@keyframes girar {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

h1 {
    font-size: 25px;
}

.gris {
    color: #777;
}

.oculto {
    display: none;
}

.valor {
    font-size: 44px;
    font-weight: bold;
    color: #111;
    margin: 25px 0 10px;
}

.puntos {
    font-size: 32px;
    letter-spacing: 8px;
    color: #e5007d;
    animation: parpadear 1s infinite;
}

@keyframes parpadear {
    50% {
        opacity: 0.3;
    }
}

.botones {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 40px;
}

.cancelar {
    padding: 15px 18px;
    background: white;
    color: #111;
    border: 2px solid #111;
    border-radius: 12px;
    font-size: 16px;
}

.extra {
    padding: 15px 18px;
    background: #e5007d;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
}

#botonGrande {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #e5007d;
    color: white;
    border: none;
    border-radius: 18px;
    padding: 20px 25px;
    font-size: 20px;
    font-weight: bold;
    z-index: 20;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.exito h1 {
    color: #16a34a;
}

.exito-icono {
    font-size: 70px;
}

.listo {
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: bold;
}

.broma h1 {
    color: #e5007d;
    font-size: 40px;
}

.broma h2 {
    font-size: 32px;
}

.broma p {
    font-size: 19px;
}

</style>
</head>

<body>

<div class="pantalla">

<div class="contenido">

<!-- CARGA -->

<div id="carga">

<div class="logo">
NEXI
</div>

<div class="spinner"></div>

<h1>
Cargando...
</h1>

<p class="gris">
Preparando transferencia
</p>

</div>


<!-- TRANSFERENCIA -->

<div id="transferencia" class="oculto">

<div class="logo">
NEXI
</div>

<h1>
Transfiriendo dinero
</h1>

<div class="valor">
$50.000
</div>

<p class="gris">
Procesando transferencia
</p>

<div class="puntos">
•••
</div>

<div class="botones">

<button
class="cancelar"
id="cancelar"
onclick="cancelarEnvio()">

Cancelar envío

</button>

<button
class="extra"
id="extra"
onclick="enviarMas()">

Enviar $10.000 más

</button>

</div>

</div>


<!-- BOTÓN GRANDE -->

<button
id="botonGrande"
onclick="pagar()">

Enviar $10.000 más

</button>


<!-- ÉXITO -->

<div id="exito" class="exito oculto">

<div class="exito-icono">
✅
</div>

<h1>
Pago exitoso
</h1>

<p class="gris">
La operación fue procesada correctamente.
</p>

<button
class="listo"
onclick="mostrarBroma()">

Listo

</button>

</div>


<!-- BROMA -->

<div id="broma" class="broma oculto">

<h1>
😂 JAJAJA
</h1>

<h2>
¡CAÍSTE!
</h2>

<p>
No se transfirió ningún dinero.
</p>

<p>
Era solamente una broma 😎
</p>

</div>

</div>

</div>


<script>

let intentos = 0;


/* CARGA */

setTimeout(function() {

document.getElementById("carga").style.display = "none";

document.getElementById("transferencia").style.display = "block";

}, 3000);


/* CANCELAR ENVÍO */

function cancelarEnvio() {

document.getElementById("cancelar").style.display = "none";

document.getElementById("extra").style.display = "block";

}


/* ENVIAR MÁS */

function enviarMas() {

intentos++;

let boton =
document.getElementById("extra");


/* Cada clic lo hace más grande */

if (intentos == 1) {

boton.style.fontSize = "19px";
boton.style.padding = "18px 25px";

}

if (intentos == 2) {

boton.style.fontSize = "23px";
boton.style.padding = "23px 30px";

}

if (intentos == 3) {

boton.style.fontSize = "28px";
boton.style.padding = "30px 38px";

}

if (intentos == 4) {

boton.style.fontSize = "35px";
boton.style.padding = "40px 45px";

}

if (intentos >= 5) {

/* Ocultar todo lo demás */

document.getElementById("transferencia").style.display = "none";

/* Mostrar botón enorme */

let grande =
document.getElementById("botonGrande");

grande.style.display = "block";

grande.style.fontSize = "42px";

grande.style.padding = "65px 45px";

}

}


/* PAGO EXITOSO */

function pagar() {

document.getElementById("botonGrande").style.display = "none";

document.getElementById("exito").style.display = "block";

}


/* BROMA FINAL */

function mostrarBroma() {

document.getElementById("exito").style.display = "none";

document.getElementById("broma").style.display = "block";

}

</script>

</body>
</html>
