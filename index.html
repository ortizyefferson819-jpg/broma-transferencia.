<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.pantalla {
    min-height: 100vh;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.contenido {
    width: 100%;
    max-width: 430px;
}

.logo {
    font-size: 48px;
    font-weight: 900;
    color: #e5007d;
    margin-bottom: 20px;
}

.spinner {
    width: 65px;
    height: 65px;
    border: 6px solid #eeeeee;
    border-top-color: #e5007d;
    border-right-color: #19a94b;
    border-radius: 50%;
    animation: girar 0.9s linear infinite;
    margin: 0 auto 25px;
}

@keyframes girar {
    to {
        transform: rotate(360deg);
    }
}

h1 {
    font-size: 25px;
    margin: 12px 0;
}

h2 {
    margin: 10px 0;
}

.gris {
    color: #777;
}

.oculto {
    display: none !important;
}

.tarjeta {
    background: #fff;
    border-radius: 22px;
    padding: 25px 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.valor {
    font-size: 45px;
    font-weight: 900;
    margin: 22px 0 8px;
}

.puntos {
    color: #e5007d;
    font-size: 30px;
    letter-spacing: 7px;
    animation: puntos 1s infinite;
}

@keyframes puntos {
    50% {
        opacity: .25;
    }
}

.botones {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-top: 35px;
}

button {
    font-family: Arial, sans-serif;
    cursor: pointer;
}

.cancelar {
    background: white;
    border: 2px solid #222;
    color: #222;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
}

.extra {
    background: #e5007d;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: bold;
    transition: .35s;
}

.extra:hover {
    transform: scale(1.03);
}

#botonFinal {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #e5007d;
    color: white;
    border: 0;
    border-radius: 20px;
    font-weight: 900;
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
    transition: .4s;
    z-index: 50;
}

.exitoIcono {
    font-size: 75px;
    margin-bottom: 10px;
}

.exito h1 {
    color: #19a94b;
    font-size: 32px;
}

.listo {
    margin-top: 25px;
    background: #19a94b;
    color: white;
    border: 0;
    border-radius: 13px;
    padding: 16px 45px;
    font-size: 18px;
    font-weight: bold;
}

.broma h1 {
    color: #e5007d;
    font-size: 44px;
}

.broma h2 {
    font-size: 34px;
}

.broma p {
    font-size: 19px;
}

@media (max-width: 430px) {

    .botones {
        flex-direction: column;
    }

    .cancelar,
    .extra {
        width: 100%;
    }

}
</style>
</head>

<body>

<div class="pantalla">
<div class="contenido">

<!-- CARGANDO -->

<div id="carga">

    <div class="logo">NEXI</div>

    <div class="spinner"></div>

    <h1>Cargando...</h1>

    <p class="gris">
        Preparando transferencia
    </p>

</div>


<!-- TRANSFERENCIA -->

<div id="transferencia" class="oculto">

    <div class="tarjeta">

        <div class="logo">NEXI</div>

        <h1>
            Transfiriendo dinero
        </h1>

        <div class="valor">
            $50.000
        </div>

        <p class="gris">
            Procesando transferencia
        </p>

        <div class="puntos">
            •••
        </div>

        <div class="botones">

            <button
                id="cancelar"
                class="cancelar"
                onclick="cancelar()">
                Cancelar envío
            </button>

            <button
                id="extra"
                class="extra"
                onclick="crecer()">
                Enviar $10.000 más
            </button>

        </div>

    </div>

</div>


<!-- BOTÓN FINAL -->

<button
    id="botonFinal"
    class="oculto"
    onclick="pagoExitoso()">

    Enviar $10.000 más

</button>


<!-- ÉXITO -->

<div id="exito" class="exito oculto">

    <div class="exitoIcono">
        ✅
    </div>

    <h1>
        Pago exitoso
    </h1>

    <p class="gris">
        La operación fue procesada correctamente.
    </p>

    <button
        class="listo"
        onclick="broma()">

        Listo

    </button>

</div>


<!-- BROMA -->

<div id="broma" class="broma oculto">

    <h1>
        😂 JAJAJA
    </h1>

    <h2>
        ¡CAÍSTE!
    </h2>

    <p>
        No se transfirió ningún dinero.
    </p>

    <p>
        Era solamente una broma 😎
    </p>

</div>

</div>
</div>


<script>

let clics = 0;


/* CARGA INICIAL */

setTimeout(() => {

    document.getElementById("carga")
        .classList.add("oculto");

    document.getElementById("transferencia")
        .classList.remove("oculto");

}, 3000);


/* CANCELAR */

function cancelar() {

    document.getElementById("cancelar")
        .style.display = "none";

}


/* CRECER */

function crecer() {

    clics++;

    const boton =
        document.getElementById("extra");

    const tamaños = [
        ["17px", "17px"],
        ["20px", "20px"],
        ["24px", "25px"],
        ["29px", "32px"],
        ["35px", "40px"]
    ];

    const posicion =
        Math.min(clics - 1, tamaños.length - 1);

    boton.style.fontSize =
        tamaños[posicion][0];

    boton.style.padding =
        `${12 + clics * 6}px ${18 + clics * 7}px`;

    boton.style.borderRadius =
        `${12 + clics}px`;

    /* Después de varios clics */

    if (clics >= 5) {

        document.getElementById("transferencia")
            .classList.add("oculto");

        const final =
            document.getElementById("botonFinal");

        final.classList.remove("oculto");

        final.style.fontSize = "40px";

        final.style.padding = "65px 45px";

    }

}


/* PAGO */

function pagoExitoso() {

    document.getElementById("botonFinal")
        .classList.add("oculto");

    document.getElementById("exito")
        .classList.remove("oculto");

}


/* BROMA */

function broma() {

    document.getElementById("exito")
        .classList.add("oculto");

    document.getElementById("broma")
        .classList.remove("oculto");

}

</script>

</body>
</html>
